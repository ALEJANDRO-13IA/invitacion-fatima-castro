<style>
:root{
  --mesa:#efe6f3;--mesa-2:#e2d2ea;--papel:#fffdf8;
  --lila:#c9a9dc;--lila-suave:#ead9f2;--morado:#5b2a6f;--morado-2:#7a3e90;
  --oro:#c9a24a;--oro-2:#e6c87a;--tinta:#3f2b4a;
  --script:'Great Vibes',cursive;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(900px 600px at 10% 0%, #f3e4fb 0%, transparent 60%),
    radial-gradient(700px 500px at 100% 100%, #f1dcd0 0%, transparent 55%),
    linear-gradient(180deg,var(--mesa),var(--mesa-2));
  color:var(--tinta);font-family:var(--serif);min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
.petalos{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petalo{position:absolute;top:-6vh;width:14px;height:18px;border-radius:60% 60% 60% 60%/70% 70% 30% 30%;background:linear-gradient(160deg,#e9d2f3,#c9a9dc);opacity:.75;animation:caer linear infinite}
.petalo:nth-child(odd){background:linear-gradient(160deg,#fff6e0,#f0d9a1)}
@keyframes caer{0%{transform:translateY(-10vh) rotate(0) translateX(0)}50%{transform:translateY(50vh) rotate(180deg) translateX(30px)}100%{transform:translateY(110vh) rotate(360deg) translateX(-20px)}}

.escena{position:relative;z-index:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}
.pista{font-size:1.05rem;letter-spacing:.18em;text-transform:uppercase;color:var(--morado-2);opacity:.85;text-align:center;margin:0}
.pista small{display:block;letter-spacing:.06em;text-transform:none;font-style:italic;opacity:.8;margin-top:4px}

/* SOBRE */
.sobre-wrap{perspective:1600px;width:100%;max-width:420px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sobre{position:relative;width:100%;aspect-ratio:3/2;max-width:100%;transform-style:preserve-3d;transition:transform .6s}
.sobre-wrap:hover .sobre{transform:translateY(-4px) rotateX(2deg)}
.cuerpo{position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,#f3e8f7,#d9c3e4);box-shadow:0 30px 60px -20px rgba(70,30,90,.45),0 2px 0 #fff inset;overflow:hidden}
.cuerpo::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.6%,#cfb3dd 50%,#e7d4ef 100%);clip-path:polygon(0 0,50% 55%,0 100%)}
.cuerpo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom left,transparent 49.6%,#cfb3dd 50%,#e7d4ef 100%);clip-path:polygon(100% 0,50% 55%,100% 100%)}
.fondo{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(180deg,#e9d6f1,#d6bfe3);clip-path:polygon(0 100%,50% 0,100% 100%);border-radius:0 0 10px 10px;z-index:3;box-shadow:0 -6px 14px -8px rgba(60,20,80,.35)}
.borde-oro{position:absolute;inset:10px;border:1px solid rgba(201,162,74,.55);border-radius:6px;pointer-events:none;z-index:4}
.tarjeta-mini{position:absolute;left:8%;right:8%;top:14%;height:80%;background:var(--papel);border-radius:4px;z-index:2;box-shadow:0 4px 12px rgba(60,20,80,.2);transition:transform .9s cubic-bezier(.2,.8,.2,1) .35s}
.tarjeta-mini::before{content:"";position:absolute;inset:12px;border:1px solid var(--oro-2)}
.tarjeta-mini span{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--script);font-size:clamp(1.4rem,6vw,2.2rem);color:var(--morado)}
.solapa{position:absolute;left:0;right:0;top:0;height:56%;background:linear-gradient(180deg,#f6ecf9,#dcc6e6);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .8s cubic-bezier(.4,0,.2,1);z-index:5;backface-visibility:hidden;border-radius:10px 10px 0 0}
.solapa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 40%)}
.sello{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d78a,#c9a24a 55%,#9a7426);box-shadow:0 6px 14px rgba(80,50,0,.35),0 0 0 4px rgba(255,255,255,.35) inset;z-index:6;display:grid;place-items:center;font-family:var(--script);font-size:2.3rem;color:#5b2a6f;transition:transform .5s,opacity .5s}
.sello::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(91,42,111,.45)}
.destinatario{position:absolute;left:6%;right:6%;bottom:11%;text-align:center;z-index:4;font-family:var(--script);font-size:clamp(1.3rem,5.5vw,1.9rem);color:var(--morado-2);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.abierto .solapa{transform:rotateX(180deg);z-index:1}
.abierto .sello{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.abierto .tarjeta-mini{transform:translateY(-78%)}
.abierto .sobre-wrap{cursor:default;animation:desvanecer .5s forwards 1.1s}
.abierto .pista{animation:desvanecer .5s forwards 1.1s}
@keyframes desvanecer{to{opacity:0;max-height:0;transform:scale(.9);margin:0;pointer-events:none;overflow:hidden}}

/* INVITACIÓN */
.invitacion{display:none;width:100%;max-width:560px;border-radius:12px;box-shadow:0 40px 80px -30px rgba(70,30,90,.5);opacity:0;transform:translateY(30px) scale(.96)}
.abierto .invitacion{display:block;animation:aparecer .9s cubic-bezier(.2,.8,.2,1) forwards 1.2s}
@keyframes aparecer{to{opacity:1;transform:none}}
.img-wrap{position:relative;width:100%;line-height:0;border-radius:12px;overflow:hidden;background:#fdfaf5;container-type:inline-size}
.img-wrap img{width:100%;height:auto;display:block;max-width:100%}
.hot{position:absolute;display:block;border-radius:40px;-webkit-tap-highlight-color:transparent;transition:box-shadow .2s,transform .2s;cursor:pointer;border:0;background:transparent;padding:0}
.hot:hover,.hot:focus-visible{box-shadow:0 0 0 3px rgba(201,162,74,.85),0 10px 24px -8px rgba(70,30,90,.5);transform:translateY(-1px);outline:none}
.familia{position:absolute;left:12%;right:12%;top:64.4%;height:7.4%;display:flex;align-items:center;justify-content:center;font-family:var(--script);font-size:9.5cqw;color:#4d1f63;line-height:1;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.6);pointer-events:none}
.familia.larga{font-size:7cqw}
.familia.xlarga{font-size:5.6cqw}
.badge{position:absolute;left:46.9%;top:75.6%;width:5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a4aa5,#5b2a6f 60%,#43194f);box-shadow:0 0 0 2px #f4e0b0,0 2px 6px rgba(60,20,80,.4);display:grid;place-items:center;font-family:var(--serif);font-weight:600;color:#fff;font-size:3.4cqw;line-height:1;pointer-events:none}
.estado{position:absolute;left:22.7%;width:53.6%;top:84.3%;height:2.3%;display:flex;align-items:center;justify-content:center;font-size:2.5cqw;font-weight:600;color:#2e7d4f;letter-spacing:.03em;pointer-events:none;line-height:1}

/* MODAL */
.velo{position:fixed;inset:0;background:rgba(50,20,70,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.velo.on{display:flex}
.modal{width:100%;max-width:420px;background:linear-gradient(180deg,#fffdf8,#f7eef5);border-radius:18px;box-shadow:0 30px 70px -20px rgba(40,10,60,.6),0 0 0 1px rgba(201,162,74,.5);padding:26px 22px;text-align:center;max-height:92vh;overflow:auto}
.modal h2{font-family:var(--script);font-weight:400;color:var(--morado);font-size:2.4rem;margin:0 0 4px;line-height:1.1}
.modal p{margin:6px 0;font-size:1.1rem;line-height:1.45}
.modal .sub{color:var(--morado-2);font-style:italic}
.cupos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 6px}
.cupo{min-width:52px;height:52px;border-radius:50%;border:1.5px solid var(--oro);background:#fff;color:var(--morado);font-family:var(--serif);font-size:1.4rem;font-weight:600;cursor:pointer;transition:all .15s}
.cupo.todos{border-radius:28px;padding:0 18px;font-size:1.05rem}
.cupo.sel{background:var(--morado);color:#fff;border-color:var(--morado);transform:scale(1.06)}
.cupo:focus-visible{outline:3px solid var(--oro-2);outline-offset:2px}
.nombres{width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--oro-2);border-radius:10px;font-family:var(--serif);font-size:1.05rem;resize:vertical;min-height:70px;background:#fff;color:var(--tinta)}
.acciones{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{padding:13px 16px;border-radius:12px;border:0;font-family:var(--serif);font-size:1.1rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn.p{background:linear-gradient(180deg,#7a3e90,#5b2a6f);color:#fff;box-shadow:0 8px 18px -8px rgba(70,30,90,.7)}
.btn.p:disabled{opacity:.5;cursor:not-allowed}
.btn.s{background:transparent;color:var(--morado-2);text-decoration:underline;font-weight:400;font-size:1rem}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.gracias-ico{font-size:3rem;color:var(--oro);line-height:1}
.err{color:#9b2c2c;font-size:.95rem;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.petalos{display:none}.abierto .invitacion{opacity:1;transform:none}.abierto .sobre-wrap,.abierto .pista{display:none}}
.pill{position:absolute;left:18%;width:64%;top:72.8%;height:4.0%;display:flex;align-items:center;justify-content:center;gap:1.2cqw;font-family:var(--serif);font-weight:600;font-size:3.3cqw;color:#4d1f63;white-space:nowrap;pointer-events:none;line-height:1}
.pill .b{display:inline-grid;place-items:center;width:4.9cqw;height:4.9cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a4aa5,#5b2a6f 60%,#43194f);box-shadow:0 0 0 0.2cqw #f4e0b0,0 0.2cqw 0.6cqw rgba(60,20,80,.4);color:#fff;font-size:3.4cqw}
</style>
</head>

</div>

(function(){
  var escena=document.getElementById('escena'), sobre=document.getElementById('sobre');
  function abrir(){ if(escena.classList.contains('abierto'))return; escena.classList.add('abierto'); }
  sobre.addEventListener('click',abrir);
  sobre.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();abrir();} });

  // ---- datos de la familia desde el enlace (#código) ----
  function decodificar(h){
    try{
      h=h.replace(/^#/,'').replace(/-/g,'+').replace(/_/g,'/');
      var s=decodeURIComponent(escape(atob(h)));
      var p=s.split('|'); var n=parseInt(p[1],10);
      if(!p[0]||!(n>=1&&n<=30)) return null;
      return {familia:p[0].trim(), cupos:n, codigo:h};
    }catch(e){return null;}
  }
  var h0=(location.hash||'').replace(/^#/,'').toLowerCase();
  var fam = INVITADOS[h0] ? {familia:INVITADOS[h0].n, cupos:INVITADOS[h0].k, codigo:h0} : decodificar(location.hash||'');
  var destEl=document.getElementById('destinatario'), famEl=document.getElementById('familia'), badge=document.getElementById('badge');
  if(fam){
    destEl.textContent=fam.familia; famEl.textContent=fam.familia;
    if(fam.familia.length>26) famEl.classList.add('xlarga'); else if(fam.familia.length>20) famEl.classList.add('larga');
    badge.textContent=fam.cupos; document.getElementById('pill-txt').textContent=(fam.cupos===1?'espacio para ti.':'espacios para ustedes.'); document.getElementById('pill').hidden=false;
  }

  // ---- estado guardado (ya confirmó desde este teléfono) ----
  var clave='conf-'+(fam?fam.codigo:'general'); var prev=null;
  try{ prev=JSON.parse(localStorage.getItem(clave)||'null'); }catch(e){}
  function pintarEstado(c){
    if(!c)return;
    document.getElementById('estado').textContent = c.confirmados>0 ? '✓ Confirmado: '+c.confirmados+(fam?' de '+fam.cupos:'') : '✓ Respuesta enviada';
  }
  pintarEstado(prev);

  // ---- modal ----
  var velo=document.getElementById('velo'), cuposEl=document.getElementById('cupos'), enviar=document.getElementById('enviar'), err=document.getElementById('err');

  function construirCupos(){
    cuposEl.innerHTML=''; seleccion=null; enviar.disabled=true;
    var max=fam?fam.cupos:10;
    for(var i=0;i<=max;i++){
      var b=document.createElement('button'); b.type='button'; b.className='cupo'; b.textContent=i; b.dataset.v=i;

    }
    if(fam){ var t=document.createElement('button'); t.type='button'; t.className='cupo todos'; t.textContent='Todos ('+fam.cupos+')'; t.dataset.v=fam.cupos; cuposEl.appendChild(t); }
  }
  cuposEl.addEventListener('click',function(e){
    var b=e.target.closest('.cupo'); if(!b)return;
    seleccion=parseInt(b.dataset.v,10);
    Array.prototype.forEach.call(cuposEl.children,function(x){ x.classList.toggle('sel', parseInt(x.dataset.v,10)===seleccion && (x===b || !x.classList.contains('todos') || b.classList.contains('todos'))); });
    document.getElementById('m-pregunta').textContent = seleccion===0 ? 'Lamentamos que no puedan acompañarnos.' : '¿Cuántas personas asistirán?';
    enviar.disabled=false; err.hidden=true;
  });
  document.getElementById('btn-confirmar').addEventListener('click',function(){
    document.getElementById('m-familia').textContent = fam ? fam.familia+' · '+fam.cupos+(fam.cupos===1?' espacio reservado':' espacios reservados') : 'Indíquenos cuántas personas asistirán';
    construirCupos(); document.getElementById('nombres').value=(prev&&prev.nombres)||'';
    document.getElementById('paso1').hidden=false; document.getElementById('paso2').hidden=true;
    velo.classList.add('on');
  });
  function cerrar(){ velo.classList.remove('on'); }
  document.getElementById('cerrar').addEventListener('click',cerrar);
  document.getElementById('cerrar2').addEventListener('click',cerrar);
  velo.addEventListener('click',function(e){ if(e.target===velo)cerrar(); });

  enviar.addEventListener('click',function(){
    if(seleccion===null)return;
    var datos={
      familia: fam?fam.familia:'(enlace general)',
      asignados: fam?fam.cupos:'',
      confirmados: seleccion,
      nombres: document.getElementById('nombres').value.trim(),
      codigo: fam?fam.codigo:'',
      fecha: new Date().toISOString()
    };
    enviar.disabled=true; enviar.textContent='Enviando…';
    function listo(){
      prev={confirmados:datos.confirmados,nombres:datos.nombres};
      try{ localStorage.setItem(clave,JSON.stringify(prev)); }catch(e){}
      pintarEstado(prev);
      document.getElementById('m-resumen').textContent = seleccion===0
        ? 'Hemos registrado que no podrán asistir. ¡Gracias por avisarnos!'
        : 'Confirmaron '+seleccion+(seleccion===1?' persona':' personas')+(fam?' de '+fam.cupos+' espacios reservados.':'.');
      document.getElementById('paso1').hidden=true; document.getElementById('paso2').hidden=false;
      enviar.textContent='Enviar confirmación';
    }
    if(SHEET_URL){
      fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(datos)}).then(listo).catch(function(){
        err.textContent='No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.'; err.hidden=false; enviar.disabled=false; enviar.textContent='Enviar confirmación';
      });
    }else{
      var msg='Confirmación de asistencia · Graduación de Fátima\n'+datos.familia+(fam?' ('+fam.cupos+' espacios)':'')+'\nAsistirán: '+seleccion+(datos.nombres?'\n'+datos.nombres:'');
      window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg),'_blank');
      listo();
    }
  });

  // pétalos
  var cont=document.querySelector('.petalos');
  for(var i=0;i<18;i++){
    var p=document.createElement('div');p.className='petalo';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(12+Math.random()*14)+'s';
    p.style.animationDelay=(-Math.random()*20)+'s';
    var s=.7+Math.random()*.8;p.style.width=14*s+'px';p.style.height=18*s+'px';
    cont.appendChild(p);
  }
})();
</script>
</body>
</html>
